name: Deploy

on:
  push:
    branches: [master, main]
  # Rebuild every Monday so the pub.dev numbers on the package cards stay current.
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Tell Bing and the other IndexNow search engines to re-crawl the pages.
  # Skipped on the weekly rebuild, which only refreshes the pub.dev numbers.
  indexnow:
    needs: deploy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # A failed notification must not mark a good deploy as failed.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            public

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Notify IndexNow
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node .github/scripts/indexnow.mjs "$SITE_URL"
